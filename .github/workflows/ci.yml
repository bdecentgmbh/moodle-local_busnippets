name: CI

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # One database service serves every branch of the matrix, so it has to satisfy the
      # strictest requirement in it. Moodle 5.3 asks for PostgreSQL 17 and MariaDB 11.4,
      # and Moodle declares no upper bounds, so these versions work for Moodle 4.5 as well.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      # MariaDB 11 images take MARIADB_* variables and ship healthcheck.sh instead of mysqladmin.
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_USER: 'root'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
          MARIADB_CHARACTER_SET_SERVER: "utf8mb4"
          MARIADB_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    # Only the Moodle versions Moodle itself still supports: 4.5 (LTS), 5.1, 5.2 and 5.3.
    # Boost Union names its branches like Moodle's, except for 5.3, which it develops on
    # upgrade-503 until its first 5.3 release.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported combination.
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
            boost-union-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
            boost-union-branch: 'MOODLE_405_STABLE'
            database: 'mariadb'
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
            boost-union-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'
          # The versions in between.
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
            boost-union-branch: 'MOODLE_501_STABLE'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            boost-union-branch: 'MOODLE_502_STABLE'
            database: 'mariadb'
          # The newest supported combination.
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            boost-union-branch: 'upgrade-503'
            database: 'pgsql'
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            boost-union-branch: 'upgrade-503'
            database: 'mariadb'

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # This plugin writes its snippets into Boost Union's file area and calls Boost Union's
      # API to register them, so the theme has to be present for the tests to run.
      - name: Add the theme_boost_union dependency
        run: moodle-plugin-ci add-plugin --branch ${{ matrix.boost-union-branch }} moodle-an-hochschulen/moodle-theme_boost_union

      - name: Install Moodle
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      # There are no Behat features in this plugin, so the Behat step is deliberately omitted.
      # Add it here as soon as the first feature file arrives.
